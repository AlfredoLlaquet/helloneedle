name: Publish verified Hello Needle installers

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Native build run ID for this revision
        required: true
        type: string
      publish:
        description: Publish the verified draft to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: helloneedle-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify installers and corresponding sources from the selected build
        run: |
          set -eu
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("bridge/Cargo.toml").read_text())["package"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 packaging/release/prepare.py --repo "$GH_REPO" --run "$BUILD_RUN" \
            --revision "$GITHUB_SHA" --version "$version" --out dist
      - name: Sign the complete release checksum list with GitHub's build identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Verify the receipt, upload every asset and check the draft on GitHub
        env:
          CHECKSUM_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash packaging/release/publish.sh
