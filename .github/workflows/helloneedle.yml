name: Combine and install the two native macOS disk images

on:
  push:
    branches: [hello-needle-universal-qa]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  universal:
    name: Combine both native installers and test on a clean Intel Mac
    if: github.repository == 'AlfredoLlaquet/helloneedle' && github.ref == 'refs/heads/hello-needle-universal-qa'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate the source run and five immutable artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/native_universal_qa.py identity --output evidence/build-inputs.json
      - name: Download both native disk images and their corresponding sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '45282805114'
          artifact-ids: '14871860267,14870884280,14871955283,14871441834,14869212779'
          digest-mismatch: error
          path: inputs
      - name: Verify all downloaded files and both native checksum lists
        run: python3 .github/scripts/native_universal_qa.py contents --inputs inputs --output evidence/native-hashes.json
      - name: Merge, ad hoc sign and verify every Universal executable
        run: |
          set -euo pipefail
          stem=HelloNeedle-1.0.0-macOS
          python3 -u packaging/macos/package.py universal \
            --arm "inputs/helloneedle-macos-arm64-installer/$stem-arm64.dmg" \
            --intel "inputs/helloneedle-macos-x86_64-installer/$stem-x86_64.dmg" \
            --output product 2>&1 | tee evidence/merge.log
          python3 .github/scripts/installer_artifacts.py manifest --installer "product/$stem-Universal.dmg" \
            --output "product/$stem-Universal-SHA256SUMS" --checksums \
            inputs/helloneedle-corresponding-source/SHA256SUMS \
            inputs/helloneedle-macos-x86_64-runtime-sources/SHA256SUMS \
            inputs/helloneedle-macos-arm64-runtime-sources/SHA256SUMS
      - name: Install and open the combined product on fresh macOS
        run: &clean_install |
          set -euo pipefail
          mkdir -p evidence
          stem=HelloNeedle-1.0.0-macOS-Universal
          python3 .github/scripts/installer_artifacts.py verify --installer "product/$stem.dmg" --checksums "product/$stem-SHA256SUMS"
          python3 -u packaging/macos/package.py install --image "product/$stem.dmg" \
            --prefix "$RUNNER_TEMP/Native Universal Applications" --evidence evidence/installed-documents.json \
            2>&1 | tee evidence/installed.log
      - name: Preserve the tested Universal disk image and original source references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helloneedle-macos-universal-installer
          path: product/
          compression-level: 0
          if-no-files-found: error
      - name: Preserve Intel installation evidence and merge diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-universal-evidence-x86_64
          path: evidence/
          if-no-files-found: warn

  install-arm:
    name: Install and open the combined product on fresh Apple Silicon
    needs: universal
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: helloneedle-macos-universal-installer
          path: product
          digest-mismatch: error
      - name: Verify, install and open the same disk image
        run: *clean_install
      - name: Preserve Apple Silicon installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-universal-evidence-arm64
          path: evidence/
          if-no-files-found: warn
