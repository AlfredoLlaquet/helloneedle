name: Windows installer diagnostics

on:
  push:
    branches: [hello-needle-windows-qa]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: Install the recorded setup on ${{ matrix.os }}
    if: github.repository == 'AlfredoLlaquet/helloneedle' && github.ref == 'refs/heads/hello-needle-windows-qa'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      INSTALLER_RUN: '45285961791'
      INSTALLER_SHA: f357c30da0a5212f232ee32078d56d90ce67b3d1
      SETUP_ARTIFACT: '14871199161'
      DRIVER_ARTIFACT: '14871109311'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the producing revision and immutable artifact identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN"
          $run = Invoke-RestMethod $url -Headers $headers
          if ($run.head_sha -cne $env:INSTALLER_SHA -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $run.event -cne 'push' -or $run.head_branch -cne 'hello-needle-installers' -or $run.path -cne '.github/workflows/helloneedle.yml') {
              throw 'The selected workflow run does not match the installer candidate.'
          }
          $items = (Invoke-RestMethod "$url/artifacts?per_page=100" -Headers $headers).artifacts
          $pins = @{
              $env:SETUP_ARTIFACT = @('helloneedle-windows-installer', 'sha256:4916f50dbdc7cab3897fbdf085ce99c26289a719976bfca5e31f45629d74490f')
              $env:DRIVER_ARTIFACT = @('helloneedle-windows-x64-test-driver', 'sha256:ee90d418a96e16e53b95dbb11589c72fceed3c3ce739094c042465e1f6340fa9')
          }
          foreach ($id in $pins.Keys) {
              $item = $items | Where-Object { $_.id -eq [long]$id }
              if (-not $item -or $item.expired -or $item.name -cne $pins[$id][0] -or $item.digest -cne $pins[$id][1]) {
                  throw "Missing or changed build artifact $id."
              }
          }
          New-Item -ItemType Directory -Force native-out/evidence | Out-Null
          @{ source = $env:INSTALLER_SHA; buildRun = $env:INSTALLER_RUN; verifier = $env:GITHUB_SHA; artifacts = $pins } |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 native-out/evidence/test-inputs.json
      - name: Download the original Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.INSTALLER_RUN }}
          artifact-ids: ${{ env.SETUP_ARTIFACT }}
          merge-multiple: true
          digest-mismatch: error
          path: native-out/installer
      - name: Download the matching Qt test driver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.INSTALLER_RUN }}
          artifact-ids: ${{ env.DRIVER_ARTIFACT }}
          merge-multiple: true
          digest-mismatch: error
          path: native-out/driver
      - name: Verify the setup and run the current acceptance test on a clean desktop
        shell: pwsh
        run: |
          $version = '1.0.0'
          $base = "HelloNeedle-$version-Windows-x64"
          $setup = Get-Item -LiteralPath "native-out/installer/$base-Setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Get-Content -LiteralPath "native-out/installer/$base-SHA256SUMS"
          if ($sums -cnotcontains "$hash  $($setup.Name)") { throw 'Installer checksum mismatch.' }
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          & ./tests/installer/verify-windows.ps1 -Installer $setup.FullName -ExpectedVersion $version `
            -Python $python -GuiTester (Resolve-Path native-out/driver/helloneedle-gui-tests.exe) `
            -EvidenceDirectory "$pwd/native-out/evidence"
      - name: Preserve acceptance evidence and the exact input identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-evidence-${{ matrix.os }}
          path: native-out/evidence/
          if-no-files-found: warn
