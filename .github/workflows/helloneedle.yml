name: Clean Apple Silicon Universal installer check

on:
  push:
    branches: [hello-needle-mac-qa]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  install:
    if: github.ref_name == 'hello-needle-mac-qa'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SOURCE_RUN: '45279043342'
      SOURCE_SHA: 485068fe182d063eacd189826610a46aaa478c71
      ARTIFACT_NAME: helloneedle-macos-universal-installer
      STEM: HelloNeedle-1.0.0-macOS-Universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the Apple Silicon host and source revision
        run: |
          set -euo pipefail
          mkdir -p evidence installer
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sw_vers | tee evidence/host.txt
          uname -m | tee -a evidence/host.txt
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15

      - name: Find and verify the producer's artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          gh api "$api" > evidence/source-run.json
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" --argjson id "$SOURCE_RUN" '
            .id == $id and .head_sha == $sha and .head_branch == "hello-needle-installers"
            and .event == "push" and .path == ".github/workflows/helloneedle.yml"
            and .repository.full_name == $repo and .head_repository.full_name == $repo
          ' evidence/source-run.json >/dev/null
          for ((attempt=1; attempt<=45; attempt++)); do
            gh api "$api/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\")" > evidence/artifact.json
            if test -s evidence/artifact.json; then break; fi
            producer=$(gh api "$api/jobs?per_page=100" --jq '.jobs[] | select(.name == "macOS 15 Intel, native Cocoa and Universal installer") | .status')
            if test "$producer" = completed; then echo "Producer finished without the Universal artifact" >&2; exit 1; fi
            sleep 60
          done
          jq -se --arg sha "$SOURCE_SHA" --arg name "$ARTIFACT_NAME" --argjson run "$SOURCE_RUN" '
            length == 1 and (.[0] | .name == $name and .expired == false and .size_in_bytes > 0
              and .workflow_run.id == $run and .workflow_run.head_sha == $sha
              and (.digest | test("^sha256:[0-9a-f]{64}$")))
          ' evidence/artifact.json >/dev/null
          id=$(jq -r .id evidence/artifact.json)
          digest=$(jq -r '.digest | sub("^sha256:";"")' evidence/artifact.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/Universal.zip"
          echo "$digest  $RUNNER_TEMP/Universal.zip" | shasum -a 256 -c
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          stem = os.environ["STEM"]
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "Universal.zip") as archive:
              if sorted(archive.namelist()) != [stem + "-SHA256SUMS", stem + ".dmg"]:
                  raise SystemExit("Unexpected files in the Universal installer artifact")
              archive.extractall("installer")
          PY
          python3 .github/scripts/installer_artifacts.py verify --installer "installer/$STEM.dmg" --checksums "installer/$STEM-SHA256SUMS"
          grep -Eq "^[0-9a-f]{64}  helloneedle-1[.]0[.]0-source-${SOURCE_SHA}[.]tar[.]gz$" "installer/$STEM-SHA256SUMS"
          cp "installer/$STEM-SHA256SUMS" evidence/

      - name: Install, detach the disk image, and test the native application
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/Universal Applications"
          python3 -u packaging/macos/package.py install --image "installer/$STEM.dmg" --prefix "$destination" \
            --evidence evidence/documents.json 2>&1 | tee evidence/install.log
          app="$destination/Hello Needle.app"
          lipo "$app/Contents/MacOS/helloneedle" -verify_arch arm64 x86_64
          lipo -archs "$app/Contents/MacOS/helloneedle" | tee evidence/architectures.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.0.0
          for cpu in arm64 x86_64; do
            receipt="$app/Contents/Resources/licenses/architectures/$cpu/BUILD-ENVIRONMENT.json"
            jq -e --arg sha "$SOURCE_SHA" --arg cpu "$cpu" '.commit == $sha and .machine == $cpu and .version == "1.0.0"' "$receipt"
            cp "$receipt" "evidence/build-$cpu.json"
          done

      - name: Retain installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clean-macos-15-arm64-universal-45279043342
          path: evidence/
          if-no-files-found: warn
