[package]
name = "helloneedle-worker"
authors = ["Alfredo Llaquet-Alsina"]
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Portable document search and preview worker for Hello Needle"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cfb = "0.16.0"
ego-tree = "0.10"
encoding_rs = "0.8"
glob = "0.3"
grep-matcher = "0.1"
grep-regex = "0.1"
html5ever = "0.35"
html5gum = { version = "0.9.2", default-features = false }
# Later ignore releases use let chains unavailable in the supported Rust 1.85.
ignore = "=0.4.23"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.38"
regex-syntax = { version = "0.8", default-features = false, features = ["unicode-perl"] }
roxmltree = "0.20"
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }
